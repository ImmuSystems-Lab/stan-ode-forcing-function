[project]
name = "stanodeffpy"
version = "0.1.0"
description = "Notebook of using forcing functions in ODEs in Stan"
readme = "README.md"
authors = [
    { name = "Pariksheet Nanda", email = "pan79@pitt.edu" },
    { name = "Rocco Caprara", email = "rjc206@pitt.edu" },
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "arviz[matplotlib]>=1.3.0",
    "cmdstanjupyter>=2.1.0",
    "cmdstanpy>=1.3.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "lets-plot>=4.11.0",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
